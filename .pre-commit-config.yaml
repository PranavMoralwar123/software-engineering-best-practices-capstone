repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: Gitleaks secret scan
        entry: gitleaks
        language: system
        pass_filenames: false
        args:
          - protect
          - --staged
          - --verbose
          - --config
          - .gitleaks.toml

      - id: ruff-check
        name: Ruff lint
        entry: ruff check
        language: system
        types: [python]

      - id: ruff-format
        name: Ruff format
        entry: ruff format --check
        language: system
        types: [python]